<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="images/coin-indian-rupee-money-icon-260nw-2158721435-removebg-preview.png">
    <title>Dashboard</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- fontawesome icon cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
    <div id="navbar"></div>
    <div class="my-5">
        <div class="container mt-5 pt-5">
            <div class="m-auto col-12 col-sm-10 col-md-8 col-lg-6">
                <form class="transact-form" onsubmit="return addBudget(event)" id="budget-form">
                    <h1 class="text-center" id="user-head">
                        Add Budget
                    </h1>
                    <div class="form-floating mb-3 mt-5">
                        <input type="month" class="form-control" id="month" placeholder="Select month" required
                            autofocus />
                        <label for="month">Select Month</label>
                    </div>
                    <div class="form-floating mb-3">
                        <select class="form-select" id="bank" required>
                            <option value="" selected>Select</option>
                            <option value="HDFC">HDFC</option>
                            <option value="INDIAN">INDIAN</option>
                            <option value="SIB">SIB</option>
                        </select>
                        <label for="bank">Select Bank</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="category" required />
                        <label for="category">Category</label>
                    </div>
                    <div class="form-floating">
                        <input type="number" class="form-control" id="amount" step="0.01" min="0" data-step="8"
                            required />
                        <label for="amount">Amount</label>
                    </div>
                    <div class="d-flex align-items-center justify-content-evenly mt-5 text-center">
                        <button class="btn btn-success" type="submit">
                            Add Budget
                        </button>
                    </div>
                </form>

                <div class="container mt-5">
                    <h4>Previous Month Budgets</h4>
                    <div id="prev-budget-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="budgetModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Edit Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="modal-bank">

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input type="text" id="modal-category" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" id="modal-amount" class="form-control">
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="submitBudgetModal()">Submit</button>
                </div>

            </div>
        </div>
    </div>

    <div id="page-loader" class="page-loader d-none">
        <div class="spinner-border text-light"></div>
        <p class="mt-3 text-light">Please wait...</p>
    </div>

</body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Main Script -->
<script src="js/main.js"></script>
<!-- Sweet Alert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!--For Session-->
<script src="js/session.js"></script>
<!--budget JS-->
<script src="js/budget.js"></script>

</html>
