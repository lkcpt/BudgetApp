<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="images/coin-indian-rupee-money-icon-260nw-2158721435-removebg-preview.png">
    <title>Overview</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- Overview CSS -->
    <link rel="stylesheet" href="css/overview.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- fontawesome icon cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
    <div id="navbar"></div>
    <div class="my-5">
        <div class="container mt-5 pt-5">
            <h3 class="mb-2">Category Overview</h3>
            <div class="row mb-3 g-2">
                <div class="form-floating col-md-4">
                    <input type="date" id="fromDate" placeholder="Select From Date" class="form-control" />
                    <label for="fromDate">Select From Date</label>
                </div>
                <div class="form-floating col-md-4">
                    <input type="date" id="toDate" class="form-control" />
                    <label for="toDate">Select To Date</label>
                </div>
                <div class="col-md-4 d-flex align-items-center justify-content-center">
                    <button class="btn btn-warning w-100" onclick="resetDateFilter()">Reset</button>
                </div>
            </div>

            <div class="row g-3 mb-4 justify-content-center" id="total-balance-card"></div>
            <div id="categoryCards"></div>
        </div>
    </div>

    <div id="page-loader" class="page-loader d-none">
        <div class="spinner-border text-light"></div>
        <p class="mt-3 text-light">Please wait...</p>
    </div>

</body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sweet Alert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Pie Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<!-- Main Scripts -->
<script src="js/main.js"></script>
<script src="js/session.js"></script>
<script src="js/monthlyoverview.js"></script>



</html>
