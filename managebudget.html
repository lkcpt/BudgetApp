<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="images/coin-indian-rupee-money-icon-260nw-2158721435-removebg-preview.png">
    <title>Manage Budget</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- fontawesome icon cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
    <div id="navbar"></div>
    <div class="mt-5">
        <div class="container mt-5 pt-5">
            <h3 class="mb-2">Manage Budget</h3>
            <h5 class="mb-4" id="displaymonth"></h5>
            <h3 id="mine" class="mb-3 px-3 py-2 rounded text-white fw-bold d-inline-block"></h3>
            <div id="bankTables"></div>
        </div>
    </div>
    <div class="modal fade" id="BudgetModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="RowId" />
                    <form class="transact-form" id="budgettemp-form">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Select Date</label>
                                <input type="date" class="form-control" id="date" required />
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="bank">Bank</label>
                                <input type="text" class="form-control" id="bank" required disabled />
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="type">Mode</label>
                                <select class="form-select" id="type" onchange="loadapp();" required>
                                    <option value="" selected>Select</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="Withdrawal">Withdrawal</option>
                                    <option value="Debit Card">Debit Card</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="app">Select App</label>
                                <select class="form-select" id="app" required disabled></select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="category">Category</label>
                                <input type="text" class="form-control" id="category" required disabled />
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="description">Description</label>
                                <textarea class="form-control" placeholder="Leave a comment here" id="description"
                                    style="height: 100px" required></textarea>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="paymentRadio" id="paymentRadio1">
                                <label class="form-check-label" for="paymentRadio1">
                                    Full Payment
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="paymentRadio" id="paymentRadio2"
                                    checked>
                                <label class="form-check-label" for="paymentRadio2">
                                    Part Payment
                                </label>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="amount">Amount</label>
                                <input type="number" class="form-control" id="amount" required disabled />
                                <div id="amountWarning" class="text-danger small mt-1" style="display:none;"></div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="button" class="btn btn-success" onclick="transact()">
                        Pay
                    </button>

                </div>
            </div>
        </div>
    </div>

    <div id="page-loader" class="page-loader d-none">
        <div class="spinner-border text-light"></div>
        <p class="mt-3 text-light">Please wait...</p>
    </div>

</body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Main Script -->
<script src="js/main.js"></script>
<!-- Sweet Alert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!--For Session-->
<script src="js/session.js"></script>
<!--Budget Script-->
<script src="js/managebuget.js"></script>

</html>
